spring.application.name=tracex
server.port=8080

# ---- Error Handling ----
server.error.include-message=always
server.error.include-binding-errors=always

# ---- Neo4j (change the password to the one you set in Neo4j Desktop) ----
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=tracex12345

# ---- Relational store for users, audit log, review decisions (file-based H2) ----
spring.datasource.url=jdbc:h2:file:./data/tracexdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Web ----
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB

# ---- AI entity extraction (Python + spaCy service in the tracex-nlp folder) ----
# Optional. If the service is not running, TraceX falls back to pattern matching automatically.
tracex.nlp.enabled=true
tracex.nlp.url=http://127.0.0.1:8001
