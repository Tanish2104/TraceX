<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forensic Audit Ledger — TraceX')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="wrap wide">
  <div class="page-header">
    <div class="page-title-group">
      <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent); vertical-align:middle; margin-right:8px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Immutable Forensic Audit Ledger
      </h1>
      <p class="page-subtitle">Cryptographic chain-of-custody log. Records cannot be edited, altered, or pruned.</p>
    </div>

    <!-- Quick filter input -->
    <div style="min-width: 280px;">
      <input type="search" id="audit-filter" placeholder="Filter audit trail by user, action, or details..." style="width: 100%;">
    </div>
  </div>

  <div class="table-card">
    <div class="scroll">
      <table id="audit-table">
        <thead>
          <tr>
            <th style="width: 170px;">Timestamp (UTC)</th>
            <th style="width: 120px;">Officer ID</th>
            <th style="width: 180px;">Action Conducted</th>
            <th>Evidentiary Audit Trail Details</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="e : ${entries}">
            <td class="mono" th:text="${#temporals.format(e.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2025-01-01 12:00:00</td>
            <td>
              <span class="badge" style="font-size:0.75rem;" th:text="${e.username}">analyst</span>
            </td>
            <td>
              <span class="badge" style="font-family:var(--font-mono); font-size:0.75rem;"
                    th:classappend="${#strings.contains(e.action, 'REJECT')} ? 'bad' : (${#strings.contains(e.action, 'ACCEPT')} ? 'ok' : '')"
                    th:text="${e.action}">ACTION</span>
            </td>
            <td class="ev" style="max-width: none;" th:text="${e.details}">Details regarding the operation performed</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
  // Instant real-time audit filter
  document.getElementById('audit-filter')?.addEventListener('input', function (e) {
    var query = e.target.value.toLowerCase();
    var rows = document.querySelectorAll('#audit-table tbody tr');
    rows.forEach(function (row) {
      row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
    });
  });
</script>
</body>
</html>
