<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' — TraceX Intelligence'">TraceX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<nav class="nav" th:fragment="nav">
  <a class="brand-wrapper" th:href="@{/}">
    <div class="brand-icon">
      <!-- Shield / Network node radar icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <circle cx="12" cy="11" r="2.5" fill="currentColor"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand">TraceX</span>
      <span class="brand-tag">FORENSIC SUITE</span>
    </div>
  </a>

  <div class="nav-links">
    <a th:href="@{/}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a th:href="@{/graph}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Graph
    </a>
    <a th:href="@{/analysis/key}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      Key entities
    </a>
    <a th:href="@{/analysis/path}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      Missing links
    </a>
    <a th:href="@{/upload}" sec:authorize="hasAnyRole('ANALYST','SUPERVISOR')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload
    </a>
    <a th:href="@{/audit}" sec:authorize="hasAnyRole('AUDITOR','SUPERVISOR')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Audit log
    </a>
  </div>

  <span class="spacer"></span>

  <div class="nav-actions">
    <!-- Theme Toggle -->
    <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light / Dark mode" aria-label="Toggle theme">
      <span id="theme-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </span>
    </button>

    <!-- User Profile Badge with Active Role -->
    <div class="user-profile-badge" sec:authorize="isAuthenticated()">
      <span class="who">Signed in as <strong sec:authentication="name">user</strong></span>
      <span class="badge" sec:authorize="hasRole('ANALYST')" style="background:var(--accent-subtle); color:var(--accent); font-size:0.7rem; padding: 2px 7px;">Analyst</span>
      <span class="badge" sec:authorize="hasRole('SUPERVISOR')" style="background:rgba(16,185,129,0.15); color:var(--ok); font-size:0.7rem; padding: 2px 7px;">Supervisor</span>
      <span class="badge" sec:authorize="hasRole('AUDITOR')" style="background:rgba(245,158,11,0.15); color:var(--warn); font-size:0.7rem; padding: 2px 7px;">Auditor</span>
    </div>

    <!-- Sign In link if anonymous -->
    <div class="user-profile-badge" sec:authorize="!isAuthenticated()">
      <a th:href="@{/login}" class="btn small primary" style="padding: 4px 10px;">Sign in</a>
    </div>

    <!-- Logout Button -->
    <form th:action="@{/logout}" method="post" class="inline" sec:authorize="isAuthenticated()">
      <button type="submit" class="linkbtn" title="Sign out of TraceX">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </form>
  </div>
</nav>
</body>
</html>
