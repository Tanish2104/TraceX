<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Graph')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="wrap wide">
  <h1>Network graph</h1>
  <p class="muted" id="status">Loading the graph...</p>
  <div class="legend">
    <span><i style="background:#c0392b"></i>Person</span>
    <span><i style="background:#2980b9"></i>Phone</span>
    <span><i style="background:#27ae60"></i>Vehicle</span>
    <span><i style="background:#8e44ad"></i>Account</span>
    <span><i style="background:#e67e22"></i>Location</span>
  </div>
  <div id="network"></div>
</main>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script th:src="@{/js/graph.js}"></script>
</body>
</html>
